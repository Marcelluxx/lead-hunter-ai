name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked test environment
        run: uv sync --frozen --group test --no-install-project

      - name: Compile source
        run: uv run --frozen --group test python -m compileall -q src tests main.py

      - name: Run security boundary tests
        run: uv run --frozen --group test python -m unittest discover -s tests -v

  postgres-integration:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
      REQUIRE_POSTGRES_TESTS: "1"
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: leadhunter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-owner-password
          LEADHUNTER_APP_DB_PASSWORD: ci-app-password
          LEADHUNTER_WORKER_DB_PASSWORD: ci-worker-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d leadhunter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked test environment
        run: uv sync --frozen --group test --no-install-project

      - name: Initialize least-privilege database roles
        run: docker exec -i "${{ job.services.postgres.id }}" sh -s < docker/postgres/init.sh

      - name: Configure integration database URLs
        shell: bash
        run: |
          port="${{ job.services.postgres.ports[5432] }}"
          {
            echo "DATABASE_MIGRATION_URL=postgresql+psycopg://postgres:ci-owner-password@localhost:${port}/leadhunter"
            echo "TEST_DATABASE_OWNER_URL=postgresql+psycopg://postgres:ci-owner-password@localhost:${port}/leadhunter"
            echo "TEST_DATABASE_APP_URL=postgresql+psycopg://leadhunter_app:ci-app-password@localhost:${port}/leadhunter"
            echo "TEST_DATABASE_WORKER_URL=postgresql+psycopg://leadhunter_worker:ci-worker-password@localhost:${port}/leadhunter"
          } >> "$GITHUB_ENV"

      - name: Apply PostgreSQL migrations
        run: uv run --frozen --group test alembic upgrade head

      - name: Run mandatory PostgreSQL integration tests
        run: >-
          uv run --frozen --group test python -m unittest discover
          -s tests/integration -t . -v

  container-release-gate:
    name: Container, migrations and API smoke
    runs-on: ubuntu-latest
    env:
      POSTGRES_ADMIN_PASSWORD: ci-owner-password
      LEADHUNTER_APP_DB_PASSWORD: ci-app-password
      LEADHUNTER_WORKER_DB_PASSWORD: ci-worker-password
      LEADHUNTER_IMAGE_TAG: ci

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create ephemeral runtime secrets
        shell: bash
        run: |
          mkdir -p secrets
          openssl genpkey -algorithm ED25519 -out secrets/jwt_private.pem
          openssl pkey -in secrets/jwt_private.pem -pubout -out secrets/jwt_public.pem
          chmod 0400 secrets/jwt_private.pem
          chmod 0444 secrets/jwt_public.pem
          # Match the non-root runtime identity declared in the Dockerfile.
          sudo chown 10001:10001 secrets/jwt_private.pem secrets/jwt_public.pem
          python - <<'PY' >> "$GITHUB_ENV"
          import base64
          import secrets

          for name in (
              "LEADHUNTER_MASTER_KEY_BASE64",
              "LEADHUNTER_SUPPRESSION_HMAC_KEY_BASE64",
          ):
              value = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode("ascii")
              print(f"{name}={value}")
          PY

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build the locked application image
        run: docker compose build api

      - name: Verify PostgreSQL migration round trip
        shell: bash
        run: |
          docker compose up -d --wait postgres redis
          roles="$(
            docker compose exec -T postgres psql \
              -U postgres \
              -d leadhunter \
              -v ON_ERROR_STOP=1 \
              -tAc "SELECT string_agg(rolname, ',' ORDER BY rolname) FROM pg_roles WHERE rolname IN ('leadhunter_app','leadhunter_worker');"
          )"
          test "${roles//[[:space:]]/}" = "leadhunter_app,leadhunter_worker"
          docker compose run --rm migrate alembic upgrade head
          docker compose run --rm migrate alembic downgrade base
          docker compose run --rm migrate alembic upgrade head

      - name: Start and verify the API container
        shell: bash
        run: |
          docker compose up -d --wait api
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8000/health/live", timeout=5) as response:
              assert response.status == 200
              assert json.load(response) == {"status": "ok"}
          PY

      - name: Capture container diagnostics
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans
