name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked test environment
        run: uv sync --frozen --group test --no-install-project

      - name: Compile source
        run: uv run --frozen --group test python -m compileall -q src tests main.py

      - name: Run security boundary tests
        run: uv run --frozen --group test python -m unittest discover -s tests -v

  postgres-integration:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
      REQUIRE_POSTGRES_TESTS: "1"
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: leadhunter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-owner-password
          LEADHUNTER_APP_DB_PASSWORD: ci-app-password
          LEADHUNTER_WORKER_DB_PASSWORD: ci-worker-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d leadhunter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked test environment
        run: uv sync --frozen --group test --no-install-project

      - name: Initialize least-privilege database roles
        run: docker exec -i "${{ job.services.postgres.id }}" sh -s < docker/postgres/init.sh

      - name: Configure integration database URLs
        shell: bash
        run: |
          port="${{ job.services.postgres.ports[5432] }}"
          {
            echo "DATABASE_MIGRATION_URL=postgresql+psycopg://postgres:ci-owner-password@localhost:${port}/leadhunter"
            echo "TEST_DATABASE_OWNER_URL=postgresql+psycopg://postgres:ci-owner-password@localhost:${port}/leadhunter"
            echo "TEST_DATABASE_APP_URL=postgresql+psycopg://leadhunter_app:ci-app-password@localhost:${port}/leadhunter"
            echo "TEST_DATABASE_WORKER_URL=postgresql+psycopg://leadhunter_worker:ci-worker-password@localhost:${port}/leadhunter"
          } >> "$GITHUB_ENV"

      - name: Apply PostgreSQL migrations
        run: uv run --frozen --group test alembic upgrade head

      - name: Run mandatory PostgreSQL integration tests
        run: >-
          uv run --frozen --group test python -m unittest discover
          -s tests/integration -t . -v
