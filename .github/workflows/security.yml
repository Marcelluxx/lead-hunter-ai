name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    name: SBOM, vulnerabilities and licenses
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up release Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked audit tooling
        run: uv sync --frozen --no-default-groups --group audit --no-install-project

      - name: Export locked runtime inventory and CycloneDX SBOM
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/supply-chain"
          mkdir -p "${artifact_dir}"
          uv export \
            --frozen \
            --no-default-groups \
            --no-emit-project \
            --format requirements.txt \
            --output-file "${artifact_dir}/runtime-requirements.txt"
          uv export \
            --frozen \
            --no-default-groups \
            --no-emit-project \
            --format cyclonedx1.5 \
            --output-file "${artifact_dir}/sbom.cdx.json"

      - name: Fail on known runtime vulnerabilities
        run: >-
          uv run --frozen --no-default-groups --group audit pip-audit
          --requirement "${RUNNER_TEMP}/supply-chain/runtime-requirements.txt"
          --require-hashes
          --disable-pip
          --strict
          --progress-spinner off
          --format json
          --output "${RUNNER_TEMP}/supply-chain/vulnerabilities.json"

      - name: Enforce commercial license policy
        shell: bash
        run: |
          uv run --frozen --no-default-groups --group audit pip-licenses \
            --format json \
            --output-file "${RUNNER_TEMP}/supply-chain/environment-licenses.json"
          uv run --frozen --no-default-groups --group audit python scripts/check_licenses.py \
            --inventory "${RUNNER_TEMP}/supply-chain/environment-licenses.json" \
            --sbom "${RUNNER_TEMP}/supply-chain/sbom.cdx.json" \
            --policy .github/license-policy.json \
            --report "${RUNNER_TEMP}/supply-chain/license-policy-report.json"

      - name: Retain supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-${{ github.sha }}
          path: ${{ runner.temp }}/supply-chain
          if-no-files-found: error
          retention-days: 30
