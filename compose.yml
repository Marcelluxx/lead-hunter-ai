name: leadhunter

x-server-env: &server-env
  LEADHUNTER_DATABASE_URL: postgresql+psycopg://leadhunter_app:${LEADHUNTER_APP_DB_PASSWORD:?app database password required}@postgres:5432/leadhunter
  LEADHUNTER_REDIS_URL: redis://redis:6379/0
  LEADHUNTER_MASTER_KEY_BASE64: ${LEADHUNTER_MASTER_KEY_BASE64:?master key required}
  LEADHUNTER_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
  LEADHUNTER_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leadhunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?postgres admin password required}
      LEADHUNTER_APP_DB_PASSWORD: ${LEADHUNTER_APP_DB_PASSWORD:?app database password required}
      LEADHUNTER_WORKER_DB_PASSWORD: ${LEADHUNTER_WORKER_DB_PASSWORD:?worker database password required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadhunter"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    user: root
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_ADMIN_PASSWORD:?postgres admin password required}@postgres:5432/leadhunter
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *server-env
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    environment:
      <<: *server-env
      LEADHUNTER_DATABASE_URL: postgresql+psycopg://leadhunter_worker:${LEADHUNTER_WORKER_DB_PASSWORD:?worker database password required}@postgres:5432/leadhunter
    volumes:
      - ./secrets:/run/secrets:ro
    command: ["dramatiq", "src.workers.runtime", "--processes", "1", "--threads", "4"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
