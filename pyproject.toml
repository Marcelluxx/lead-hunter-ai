[project]
name = "lead-hunter-ai"
version = "0.1.0"
description = "Evidence-first lead discovery and website audit platform"
requires-python = ">=3.11,<3.14"
license = "LicenseRef-Proprietary"
dependencies = [
    "alembic>=1.16,<2",
    "beautifulsoup4>=4.12,<5",
    "crawl4ai==0.9.2",
    "cryptography>=50,<51",
    "dramatiq[redis]>=2.2,<3",
    "fastapi>=0.116,<1",
    "folium>=0.18,<1",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "playwright>=1.50,<2",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.15.1,<3",
    "pyotp>=2.9,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "python-whois>=0.9,<1",
    "redis>=6,<8",
    "requests>=2.31,<3",
    "sqlalchemy>=2.0,<2.1",
    "streamlit>=1.66,<2",
    "streamlit-folium>=0.24,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
test = [
    "httpx>=0.28,<1",
]
audit = [
    "pip-audit>=2.9,<3",
    "pip-licenses>=5,<6",
]

[tool.uv]
package = false
default-groups = ["test"]
required-version = ">=0.11.15,<0.12"
# Crawl4AI declares NLTK for NLP chunking/model utilities. Lead Hunter uses
# PruningContentFilter + DefaultMarkdownGenerator, which do not need NLTK.
# Do not distribute the vulnerable, unused package (GHSA-8mgp-746c-j5xp).
# Keep Crawl4AI pinned: revalidate this exclusion before upgrading or enabling NLP.
exclude-dependencies = ["nltk"]
# Security floors from the runtime dependency audit. Keep these constraints
# while the packages are transitive so a future resolution cannot regress.
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "brotli>=1.2.1",
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "gitpython>=3.2.1",
    "multidict>=6.9.1,<7",
    "pillow>=13.0.0",
    "urllib3>=2.8.0,<3",
]
